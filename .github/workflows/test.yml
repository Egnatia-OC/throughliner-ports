name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test (esbuild bundle + 19-test harness, real Python hooks)
        run: npm test
      - name: Rule corpus checker (port script)
        run: python3 test/rule_corpus_check.py
      - name: Verify vendored tree identity
        run: (cd vendor/throughliner && sha256sum -c ../MANIFEST.sha256)
